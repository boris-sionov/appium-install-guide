<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
    <script src="{{ '/assets/js/code-copy.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
  </head>
  <body>
    <div class="guide-shell">
      <aside class="guide-sidebar">
        <a class="guide-sidebar__brand" href="{{ '/' | relative_url }}">Appium<br>Guide</a>
        <nav class="guide-nav" aria-label="Guide sections">
          <a class="{% if page.url == '/' %}is-active{% endif %}" href="{{ '/' | relative_url }}">Overview</a>
          <a class="{% if page.url == '/installation.html' %}is-active{% endif %}" href="{{ '/installation.html' | relative_url }}">Installation</a>
          <a class="guide-nav__sub {% if page.url == '/install-windows.html' %}is-active{% endif %}" href="{{ '/install-windows.html' | relative_url }}">Windows</a>
          <a class="guide-nav__sub {% if page.url == '/install-macos.html' %}is-active{% endif %}" href="{{ '/install-macos.html' | relative_url }}">macOS</a>
          <a class="{% if page.url == '/setup.html' %}is-active{% endif %}" href="{{ '/setup.html' | relative_url }}">Setup</a>
          <a class="guide-nav__sub {% if page.url == '/android-setup.html' %}is-active{% endif %}" href="{{ '/android-setup.html' | relative_url }}">Android</a>
          <a class="guide-nav__sub {% if page.url == '/ios-setup.html' %}is-active{% endif %}" href="{{ '/ios-setup.html' | relative_url }}">iOS</a>
          <a class="{% if page.url == '/appium-inspector.html' %}is-active{% endif %}" href="{{ '/appium-inspector.html' | relative_url }}">Appium Inspector</a>
          <a class="{% if page.url == '/capabilities.html' %}is-active{% endif %}" href="{{ '/capabilities.html' | relative_url }}">Capabilities</a>
          <a class="{% if page.url == '/python-automation.html' %}is-active{% endif %}" href="{{ '/python-automation.html' | relative_url }}">Python automation</a>
          <a class="{% if page.url == '/troubleshooting.html' %}is-active{% endif %}" href="{{ '/troubleshooting.html' | relative_url }}">Troubleshooting</a>
        </nav>
      </aside>
      <main class="guide-main">
        <article class="markdown-body">
          {{ content }}
        </article>
      </main>
    </div>
  </body>
</html>
